# Optional local Postgres when Supabase is unavailable (offline / solo).
# Default development uses Supabase — see .env.example and README.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ssaemz
      POSTGRES_PASSWORD: ssaemz
      POSTGRES_DB: ssaemztalk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
