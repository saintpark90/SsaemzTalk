# Keeps the Supabase Free-tier project from pausing after 7 days of inactivity.
# Requires repo secrets: DATABASE_URL, DIRECT_URL (same values as local .env).
name: Keep Supabase Alive

on:
  schedule:
    # Every 3 days at 09:00 UTC (~18:00 KST)
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ping database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run db:ping
